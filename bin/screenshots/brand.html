<!doctype html>
<!--
	Source for the WordPress.org banner. Rendered by bin/screenshots/render-brand.js
	at 772x250 and 1544x500 (2x). The icon comes from wp-org-assets/icon.svg.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Accessibility Guardian banner</title>
<style>
	html, body { margin: 0; }
	body { width: 772px; height: 250px; overflow: hidden; }
	.banner {
		position: relative;
		box-sizing: border-box;
		width: 772px;
		height: 250px;
		padding: 0 40px 0 44px;
		display: flex;
		align-items: center;
		gap: 30px;
		background:
			radial-gradient(circle at 92% 18%, rgba(46, 204, 113, 0.18), transparent 38%),
			linear-gradient(135deg, #13202f 0%, #182c40 100%);
		color: #fff;
		font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
	}
	.banner::before {
		content: "";
		position: absolute;
		left: 0;
		top: 0;
		bottom: 0;
		width: 8px;
		background: #2ecc71;
	}
	.icon { width: 132px; height: 132px; flex: none; filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.35)); }
	h1 { margin: 0; font-size: 38px; font-weight: 700; letter-spacing: -0.01em; }
	p { margin: 8px 0 0; font-size: 17px; color: #c9d6e3; }
	ul { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 0; padding: 0; list-style: none; }
	li {
		padding: 4px 11px;
		border: 1px solid rgba(46, 204, 113, 0.55);
		border-radius: 999px;
		font-size: 13px;
		font-weight: 600;
		color: #8ff0b7;
		background: rgba(46, 204, 113, 0.08);
	}
</style>
</head>
<body>
	<div class="banner">
		<img class="icon" src="../../wp-org-assets/icon.svg" alt="">
		<div>
			<h1>Accessibility Guardian</h1>
			<p>WCAG 2.2 AA audits with axe-core, right inside WordPress</p>
			<ul>
				<li>Full-site scans</li>
				<li>Score &amp; trends</li>
				<li>Fix guidance</li>
				<li>Auto-fixes</li>
				<li>CSV / JSON</li>
			</ul>
		</div>
	</div>
</body>
</html>
