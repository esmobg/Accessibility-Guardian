<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Page not found – Accessibility Guardian</title>
	<meta name="robots" content="noindex">
	<link rel="icon" href="/Accessibility-Guardian/assets/img/icon.svg" type="image/svg+xml">
	<script>
		try {
			var accgTheme = localStorage.getItem( 'accg-theme' );
			if ( accgTheme === 'light' || accgTheme === 'dark' ) {
				document.documentElement.setAttribute( 'data-theme', accgTheme );
			}
		} catch ( e ) {}
	</script>
	<link rel="stylesheet" href="/Accessibility-Guardian/assets/css/site.css">
</head>
<body>
	<main id="content" class="final-cta" style="min-height: 100vh; display: grid; place-items: center;">
		<div class="container container--narrow">
			<img src="/Accessibility-Guardian/assets/img/icon.svg" alt="" width="96" height="96">
			<h1>Page not found</h1>
			<p>The page you were looking for does not exist or has moved.</p>
			<div class="cta cta--center">
				<a class="button button--primary" href="/Accessibility-Guardian/">Go to the home page</a>
				<a class="button button--ghost" href="https://github.com/esmobg/Accessibility-Guardian">View on GitHub</a>
			</div>
		</div>
	</main>
</body>
</html>
