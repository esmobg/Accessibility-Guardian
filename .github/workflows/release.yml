name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check that the tag matches the plugin version
        run: |
          version=$(sed -n 's/^ \* Version: *//p' accessibility-guardian.php | tr -d '[:space:]')
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match plugin version ${version}" >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Build release zip
        run: python bin/build-zip.py

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v v="## ${VERSION}" 'index($0, v) == 1 {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "dist/accessibility-guardian-${VERSION}.zip" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "dist/accessibility-guardian-${VERSION}.zip" \
              --title "Accessibility Guardian ${VERSION}" \
              --notes-file release-notes.md
          fi
